<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Bikash Talukder</title>
<meta name="description" content="The page you're looking for doesn't exist. Return to Bikash Talukder's portfolio.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1220">

<style>
  :root {
    --white:   #F0F2F5;
    --steel:   #B8C4D4;
    --slate:   #6B7E96;
    --dark:    #1A1D22;
    --dark2:   #13161A;
    --gold:    #C9A84C;
    --gold-lt: #E2C97E;
    --teal:    #1A5C5A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--dark); color: var(--white); font-family: 'Manrope', sans-serif; min-height: 100vh; }
  body {
    background: radial-gradient(ellipse at center, var(--dark2) 0%, var(--dark) 70%);
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
  }
  .wrap {
    text-align: center;
    max-width: 560px;
    position: relative;
    z-index: 1;
  }
  .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(120px, 28vw, 220px);
    letter-spacing: 6px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(201,168,76,0.55);
    text-shadow: 0 0 60px rgba(26,92,90,0.25);
    margin-bottom: 8px;
  }
  .num .four { color: var(--gold); -webkit-text-stroke: 0; }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: clamp(28px, 5vw, 42px);
    color: var(--white);
    margin-bottom: 16px;
  }
  p {
    font-size: 15px;
    line-height: 1.65;
    color: var(--steel);
    margin-bottom: 32px;
  }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block;
    padding: 13px 28px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    text-decoration: none;
    border-radius: 100px;
    transition: all .25s;
    cursor: pointer;
  }
  .btn-fill {
    background: var(--gold);
    color: var(--dark);
    border: 1px solid var(--gold);
  }
  .btn-fill:hover { transform: translateY(-2px); box-shadow: 0 10px 32px -8px rgba(201,168,76,.5); }
  .btn-outline {
    background: transparent;
    color: var(--white);
    border: 1px solid rgba(201,168,76,0.4);
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

  /* Decorative orbit ring */
  .ring {
    position: fixed; inset: 0; pointer-events: none;
    display: grid; place-items: center;
    z-index: 0;
  }
  .ring::before {
    content: '';
    width: min(85vw, 85vh); height: min(85vw, 85vh);
    border: 1px dashed rgba(201,168,76,0.18);
    border-radius: 50%;
  }

  .corner {
    position: fixed; top: 22px; left: 28px;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 3px; color: var(--gold);
    font-size: 18px;
  }
  .corner span { color: var(--white); }

  @media (prefers-reduced-motion: reduce) {
    .btn-fill:hover { transform: none; }
  }
</style>
</head>
<body>

<a class="corner" href="/">BT<span> · 404</span></a>

<div class="ring" aria-hidden="true"></div>

<main class="wrap">
  <div class="num" aria-hidden="true">
    <span class="four">4</span>0<span class="four">4</span>
  </div>
  <h1>Signal lost in the void.</h1>
  <p>The page you were looking for has either moved, never existed, or is resting after a long compile. Let's get you back to something useful.</p>
  <div class="actions">
    <a href="/" class="btn btn-fill">Return Home</a>
    <a href="https://github.com/bikash-20" class="btn btn-outline" rel="noopener noreferrer" target="_blank">View GitHub</a>
  </div>
</main>

</body>
</html>
